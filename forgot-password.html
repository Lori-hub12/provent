<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="ProVend es la plataforma B2B de Nicaragua que conecta empresas con proveedores verificados para optimizar la cadena de suministro.">
    <meta property="og:title" content="ProVend — Conectando Empresas y Proveedores">
    <meta property="og:description" content="Encuentra proveedores verificados y cotiza materiales para tu empresa en Nicaragua.">
    <meta property="og:image" content="https://provend.com.ni/assets/images/logo.svg">
    <meta property="og:url" content="https://provend.com.ni/">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>Recuperar Contraseña - ProVend</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/pages.css">
<script src="js/config.js"></script>
</head>
<body>
    <div class="auth-layout">
        <div class="auth-card">
            <div class="auth-logo"><a href="index.html" style="font-size:2rem; font-weight:800; color:var(--primary-600); text-decoration:none">ProVend<span style="color:var(--secondary-500)">.</span></a></div>
            <h1 class="auth-title">Recuperar Contraseña</h1>
            <p class="auth-subtitle">Ingresa tu correo y te enviaremos un enlace para restablecerla.</p>
            <form id="forgot-form" onsubmit="sendForgot(event)">
                <div class="form-group">
                    <label class="form-label">Correo Electrónico</label>
                    <input class="form-input" type="email" id="email" placeholder="ejemplo@empresa.com" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:1.5rem">Enviar Enlace</button>
            </form>
            <div style="margin-top: 2rem; text-align: center;">
                <p class="auth-switch">¿Recordaste tu contraseña? <a href="login.html">Inicia sesión</a></p>
            </div>
        </div>
    </div>

    <script>
      async function sendForgot(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const btn = e.target.querySelector('button');
        btn.textContent = 'Enviando...';
        btn.disabled = true;
  
        try {
          const res = await fetch('${API_BASE}/api/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const data = await res.json();
          
          if (res.ok) {
            alert('Revisa la consola del servidor para el enlace (Ethereal Email).');
            window.location.href = 'login.html';
          } else {
            alert(data.error);
          }
        } catch (err) {
          alert('Error de conexión');
        } finally {
          btn.textContent = 'Enviar Enlace';
          btn.disabled = false;
        }
      }
    </script>
</body>
</html>
