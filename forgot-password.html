<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="ProVend es la plataforma B2B de Nicaragua que conecta empresas con proveedores verificados para optimizar la cadena de suministro.">
    
    
    
    
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>Recuperar Contraseña - ProVend</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css?v=1787448633116">
    <link rel="stylesheet" href="css/base.css?v=1787448633116">
    <link rel="stylesheet" href="css/components.css?v=1787448633116">
    <link rel="stylesheet" href="css/layout.css?v=1787448633116">
    <link rel="stylesheet" href="css/pages.css?v=1787448633116">
<script src="js/config.js?v=1787448633116"></script>

    <!-- Open Graph y SEO -->
    <meta property="og:title" content="ProVend - Marketplace B2B Circular">
    <meta property="og:description" content="Conectando empresas con proveedores sostenibles de reciclaje.">
    <meta property="og:image" content="https://provent.onrender.com/img/logo.png">
    <meta property="og:url" content="https://provent.onrender.com">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/png" href="img/logo.png">
</head>
<body>
    <div class="auth-layout">
        <div class="auth-card">
            <div class="auth-logo"><a href="index.html" style="font-size:2rem; font-weight:800; color:var(--primary-600); text-decoration:none">ProVend<span style="color:var(--secondary-500)">.</span></a></div>
            <h1 class="auth-title">Recuperar Contraseña</h1>
            <p class="auth-subtitle">Ingresa tu correo y te enviaremos un enlace para restablecerla.</p>
            <form id="forgot-form" onsubmit="sendForgot(event)">
                <div class="form-group">
                    <label class="form-label">Correo Electrónico</label>
                    <input class="form-input" type="email" id="email" placeholder="ejemplo@empresa.com" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:1.5rem">Enviar Enlace</button>
            </form>
            <div style="margin-top: 2rem; text-align: center;">
                <p class="auth-switch">¿Recordaste tu contraseña? <a href="login.html">Inicia sesión</a></p>
            </div>
        </div>
    </div>

    <script src="js/pages/forgotPassword.js?v=1787448633116"></script>
</body>
</html>
