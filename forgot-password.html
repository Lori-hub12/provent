<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña - ProVend</title>
  <link rel="stylesheet" href="css/index.css">
  <style>
    body { background: var(--neutral-50); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-card { background: white; padding: 2.5rem; border-radius: var(--radius-xl); box-shadow: var(--shadow-xl); width: 100%; max-width: 400px; text-align: center; }
    .auth-logo { font-size: 2rem; font-weight: 800; color: var(--primary-600); margin-bottom: 1.5rem; display: block; text-decoration: none; }
  </style>
</head>
<body>
  <div class="auth-card">
    <a href="index.html" class="auth-logo">ProVend<span style="color:var(--secondary-500)">.</span></a>
    <h2 style="font-size:1.5rem; color:var(--neutral-900); margin-bottom:0.5rem">Recuperar Contraseña</h2>
    <p style="color:var(--neutral-500); margin-bottom:1.5rem; font-size:0.875rem">Ingresa tu correo y te enviaremos un enlace para restablecerla.</p>
    
    <form id="forgot-form" onsubmit="sendForgot(event)">
      <div class="form-group" style="text-align: left; margin-bottom: 1.5rem;">
        <label>Correo Electrónico</label>
        <input type="email" id="email" class="input" style="width:100%" placeholder="ejemplo@empresa.com" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Enviar Enlace</button>
    </form>
    
    <div style="margin-top:1.5rem; font-size:0.875rem">
      <a href="login.html" style="color:var(--primary-600); text-decoration:none; font-weight:500">Volver a Iniciar Sesión</a>
    </div>
  </div>

  <script>
    async function sendForgot(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const btn = e.target.querySelector('button');
      btn.textContent = 'Enviando...';
      btn.disabled = true;

      try {
        const res = await fetch('http://localhost:3000/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        
        if (res.ok) {
          alert('Revisa la consola del servidor para el enlace (Ethereal Email).');
          window.location.href = 'login.html';
        } else {
          alert(data.error);
        }
      } catch (err) {
        alert('Error de conexión');
      } finally {
        btn.textContent = 'Enviar Enlace';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
