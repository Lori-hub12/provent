<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva Contraseña - ProVend</title>
  <link rel="stylesheet" href="css/index.css">
  <style>
    body { background: var(--neutral-50); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-card { background: white; padding: 2.5rem; border-radius: var(--radius-xl); box-shadow: var(--shadow-xl); width: 100%; max-width: 400px; text-align: center; }
    .auth-logo { font-size: 2rem; font-weight: 800; color: var(--primary-600); margin-bottom: 1.5rem; display: block; text-decoration: none; }
  </style>
</head>
<body>
  <div class="auth-card">
    <a href="index.html" class="auth-logo">ProVend<span style="color:var(--secondary-500)">.</span></a>
    <h2 style="font-size:1.5rem; color:var(--neutral-900); margin-bottom:1.5rem">Nueva Contraseña</h2>
    
    <form id="reset-form" onsubmit="sendReset(event)">
      <div class="form-group" style="text-align: left; margin-bottom: 1rem;">
        <label>Nueva Contraseña</label>
        <input type="password" id="password" class="input" style="width:100%" required minlength="6">
      </div>
      <div class="form-group" style="text-align: left; margin-bottom: 1.5rem;">
        <label>Confirmar Contraseña</label>
        <input type="password" id="confirm-password" class="input" style="width:100%" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Restablecer Contraseña</button>
    </form>
  </div>

  <script>
    async function sendReset(e) {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm-password').value;
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      if (!token) {
        alert('Enlace inválido o sin token.');
        return;
      }
      if (password !== confirm) {
        alert('Las contraseñas no coinciden.');
        return;
      }

      const btn = e.target.querySelector('button');
      btn.textContent = 'Guardando...';
      btn.disabled = true;

      try {
        const res = await fetch('http://localhost:3000/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json();
        
        if (res.ok) {
          alert('Contraseña actualizada exitosamente.');
          window.location.href = 'login.html';
        } else {
          alert(data.error);
        }
      } catch (err) {
        alert('Error de conexión');
      } finally {
        btn.textContent = 'Restablecer Contraseña';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
