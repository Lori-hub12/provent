<body>
    <div class="auth-layout">

            <h1 class="auth-title">Nueva ContraseÃ±a</h1>
            <p class="auth-subtitle">Ingresa tu nueva contraseÃ±a para acceder a tu cuenta.</p>
            <form id="reset-form" onsubmit="sendReset(event)">
                <div class="form-group">
                    <label class="form-label">Nueva ContraseÃ±a</label>
                    <input class="form-input" type="password" id="password" required minlength="6" placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢">
                </div>
                <div class="form-group">
                    <label class="form-label">Confirmar ContraseÃ±a</label>
                    <input class="form-input" type="password" id="confirm-password" required minlength="6" placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢">

    <script>
      async function sendReset(e) {
        e.preventDefault();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm-password').value;
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
  
        if (!token) {
          alert('Enlace invÃ¡lido o sin token.');
          return;
        }
        if (password !== confirm) {
          alert('Las contraseÃ±as no coinciden.');
          return;
        }
  
        const btn = e.target.querySelector('button');
        btn.textContent = 'Guardando...';
        btn.disabled = true;
  
        try {
          const res = await fetch('${API_BASE}/api/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password })
          });
          const data = await res.json();
          
          if (res.ok) {
            alert('ContraseÃ±a actualizada exitosamente.');
            window.location.href = 'login.html';
          } else {
            alert(data.error);
          }
        } catch (err) {
          alert('Error de conexiÃ³n');
        } finally {
          btn.textContent = 'Restablecer ContraseÃ±a';
          btn.disabled = false;
        }
      }
    </script>
