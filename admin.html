<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Administración - ProVend</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/pages.css">
    <style>
        body { background-color: var(--neutral-50); }
        body.dark { background-color: #0B0F19; }
        
        .admin-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: 100vh;
        }

        .admin-sidebar {
            background: var(--white);
            border-right: 1px solid var(--neutral-200);
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .admin-sidebar-logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-600);
            margin-bottom: 2rem;
            padding-left: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .admin-nav-group {
            margin-bottom: 1.5rem;
        }

        .admin-nav-group-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--neutral-500);
            font-weight: 700;
            margin-bottom: 0.5rem;
            padding-left: 0.5rem;
        }

        .admin-nav-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            color: var(--neutral-600);
            text-decoration: none;
            border-radius: var(--radius-md);
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
        }

        .admin-nav-link:hover {
            background: var(--neutral-100);
            color: var(--neutral-900);
        }

        .admin-nav-link.active {
            background: var(--primary-50);
            color: var(--primary-600);
            font-weight: 600;
        }
        
        body.dark .admin-nav-link.active {
            background: rgba(43, 125, 233, 0.1);
        }

        .admin-content {
            padding: 2rem 3rem;
            max-width: 1200px;
            width: 100%;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .admin-header h1 {
            font-size: 1.875rem;
            color: var(--neutral-900);
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .kpi-card {
            background: var(--white);
            border: 1px solid var(--neutral-200);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-sm);
        }

        .kpi-label {
            color: var(--neutral-500);
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .kpi-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--neutral-900);
            margin-top: 0.5rem;
        }

        .admin-section-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--neutral-900);
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-container {
            background: var(--white);
            border: 1px solid var(--neutral-200);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            margin-bottom: 2rem;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        .admin-table th {
            background: var(--neutral-50);
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            color: var(--neutral-500);
            border-bottom: 1px solid var(--neutral-200);
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        .admin-table td {
            padding: 1rem;
            border-bottom: 1px solid var(--neutral-100);
            color: var(--neutral-900);
        }

        .admin-table tr:last-child td {
            border-bottom: none;
        }

        .empty-state {
            padding: 4rem 2rem;
            text-align: center;
            color: var(--neutral-500);
        }

        /* Tabs logic */
        .admin-tab-content {
            display: none;
        }
        .admin-tab-content.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-sidebar-logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                ProVend
            </div>

            <div class="admin-nav-group">
                <div class="admin-nav-group-title">General</div>
                <a class="admin-nav-link active" data-target="dashboard">📊 Dashboard</a>
                <a class="admin-nav-link" data-target="usuarios">👥 Usuarios</a>
                <a class="admin-nav-link" data-target="empresas">🏢 Empresas</a>
                <a class="admin-nav-link" data-target="proveedores">🏭 Proveedores</a>
                <a class="admin-nav-link" data-target="materiales">📦 Materiales</a>
                <a class="admin-nav-link" data-target="productos">🛍️ Productos</a>
            </div>

            <div class="admin-nav-group">
                <div class="admin-nav-group-title">Actividad</div>
                <a class="admin-nav-link" data-target="actividad">⚡ Actividad</a>
                <a class="admin-nav-link" data-target="resenas">⭐ Reseñas</a>
                <a class="admin-nav-link" data-target="reportes">🚩 Reportes</a>
            </div>

            <div class="admin-nav-group">
                <div class="admin-nav-group-title">Gestión</div>
                <a class="admin-nav-link" data-target="verificaciones">✅ Verificaciones</a>
                <a class="admin-nav-link" data-target="categorias">📑 Categorías</a>
            </div>

            <div class="admin-nav-group">
                <div class="admin-nav-group-title">Configuración</div>
                <a class="admin-nav-link" data-target="configuracion">⚙️ Configuración</a>
                <a class="admin-nav-link" id="btn-logout" style="color:var(--danger-600)">🚪 Cerrar sesión</a>
            </div>
        </aside>

        <main class="admin-content" id="admin-main-content">
            <!-- Rendered by js/pages/admin.js -->
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/pages/admin.js"></script>
</body>
</html>
