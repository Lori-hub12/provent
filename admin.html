<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="ProVend es la plataforma B2B de Nicaragua que conecta empresas con proveedores verificados para optimizar la cadena de suministro.">
    
    
    
    
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>Panel de Administración — ProVend</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/pages.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // AUTH GUARD: Solo Admin
        document.addEventListener('DOMContentLoaded', () => {
            if (window.ProVendAuth) {
                const user = window.ProVendAuth.getCurrentUser();
                if (!user || user.rol !== 'admin') {
                    window.location.href = 'index.html';
                }
            }
        });
    </script>
    <script src="js/pages/admin.js"></script>

    <script>
        // Build navbar
        document.getElementById('navbar-container').innerHTML = buildNavbar('admin');

        // Set admin info in sidebar
        const currentUser = ProVendAuth.getCurrentUser();
        if (currentUser) {
            document.getElementById('admin-name').textContent = currentUser.nombre || 'Admin';
            document.getElementById('admin-avatar').textContent = (currentUser.nombre || 'A').substring(0, 2).toUpperCase();
            document.getElementById('admin-welcome').textContent = `Bienvenido, ${currentUser.nombre || 'Admin'} — ${new Date().toLocaleDateString('es-NI', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}`;
        }

        // ===== SECTION NAVIGATION =====
        function showSection(name, el) {
            document.querySelectorAll('[id^="section-"]').forEach(s => s.style.display = 'none');
            document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
            document.getElementById('section-' + name).style.display = 'block';
            if (el) el.classList.add('active');
            // Lazy load section data
            if (name === 'usuarios') loadUsuarios();
            if (name === 'proveedores') loadProveedores();
            if (name === 'actividad') loadActividad();
        }

        // ===== TOAST =====
        function toast(msg, type = 'success') {
            const t = document.createElement('div');
            t.className = `toast-admin toast-${type}`;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3500);
        }

        // ===== TIME AGO =====
        function timeAgo(dateStr) {
            if (!dateStr) return '—';
            const diff = (new Date() - new Date(dateStr)) / 1000;
            if (diff < 60) return 'Hace un momento';
            if (diff < 3600) return `Hace ${Math.floor(diff/60)}m`;
            if (diff < 86400) return `Hace ${Math.floor(diff/3600)}h`;
            return `Hace ${Math.floor(diff/86400)}d`;
        }

        // ===== LOAD STATS =====
        async function loadStats() {
            try {
                const res = await ProVendAuth.apiFetch(`${API_BASE}/api/admin/stats`);
                if (!res.ok) return;
                const d = await res.json();
                document.getElementById('stat-usuarios').textContent = d.totalUsuarios;
                document.getElementById('stat-proveedores').textContent = d.totalProveedores;
                document.getElementById('stat-pendientes').textContent = d.pendientes;
                document.getElementById('stat-materiales').textContent = d.totalMateriales;
                document.getElementById('stat-empresas').textContent = d.totalEmpresas;
                document.getElementById('stat-resenas').textContent = d.totalReseñas;
                document.getElementById('badge-pendientes').textContent = d.pendientes;
                document.querySelectorAll('.stat-real').forEach(el => el.classList.remove('stat-loading'));
            } catch(e) { console.error(e); }
        }

        // ===== LOAD ACTIVIDAD =====
        let actividadData = [];
        async function loadActividad() {
            const containers = ['actividad-mini', 'actividad-full'].map(id => document.getElementById(id));
            containers.forEach(c => c && (c.innerHTML = '<div class="empty-admin"><span class="spinner-sm"></span> Cargando...</div>'));
            try {
                const res = await ProVendAuth.apiFetch(`${API_BASE}/api/admin/actividad`);
                if (!res.ok) return;
                actividadData = await res.json();
                const icons = { registro: '👤', material: '📦', resena: '⭐' };
                const html = (items) => items.length === 0
                    ? '<div class="empty-admin">Sin actividad reciente</div>'
                    : items.map(a => `
                        <div class="activity-item">
                            <div class="activity-dot ${a.tipo}"></div>
                            <div style="flex:1">
                                <div class="activity-title">${icons[a.tipo] || '📌'} ${a.titulo}</div>
                                <div class="activity-detail">${a.detalle}</div>
                            </div>
                            <div class="activity-time">${timeAgo(a.fecha)}</div>
                        </div>`).join('');
                document.getElementById('actividad-mini').innerHTML = html(actividadData.slice(0, 5));
                document.getElementById('actividad-full').innerHTML = html(actividadData);
            } catch(e) {
                containers.forEach(c => c && (c.innerHTML = '<div class="empty-admin">Error cargando actividad</div>'));
            }
        }

        // ===== LOAD USUARIOS =====
        let allUsuarios = [];
        async function loadUsuarios() {
            document.getElementById('usuarios-table-body').innerHTML = '<tr><td colspan="6" class="empty-admin"><span class="spinner-sm"></span> Cargando...</td></tr>';
            try {
                const res = await ProVendAuth.apiFetch(`${API_BASE}/api/admin/usuarios?limit=100`);
                if (!res.ok) return;
                const { usuarios, total } = await res.json();
                allUsuarios = usuarios;
                document.getElementById('usuarios-count').textContent = `${total} usuarios registrados en total`;
                renderUsuarios(usuarios);
            } catch(e) {
                document.getElementById('usuarios-table-body').innerHTML = '<tr><td colspan="6" class="empty-admin">Error al cargar usuarios</td></tr>';
            }
        }

        function renderUsuarios(list) {
            const rolBadge = { admin: 'admin', proveedor: 'prov', empresa: 'emp' };
            const rolLabel = { admin: 'Admin', proveedor: 'Proveedor', empresa: 'Empresa' };
            if (list.length === 0) {
                document.getElementById('usuarios-table-body').innerHTML = '<tr><td colspan="6" class="empty-admin">No se encontraron usuarios</td></tr>';
                return;
            }
            document.getElementById('usuarios-table-body').innerHTML = list.map(u => `
                <tr>
                    <td>
                        <div style="font-weight:600">${u.nombre || '—'}</div>
                        <div style="color:var(--neutral-500);font-size:0.8rem">${u.email}</div>
                    </td>
                    <td><span class="badge-${rolBadge[u.rol] || 'prov'}">${rolLabel[u.rol] || u.rol}</span></td>
                    <td style="color:var(--neutral-600)">${u.empresa || '—'}</td>
                    <td style="color:var(--neutral-500)">${u.created_at ? new Date(u.created_at).toLocaleDateString('es-NI') : '—'}</td>
                    <td>
                        <span style="display:inline-flex;align-items:center;gap:4px;font-size:0.8rem;font-weight:600;color:${u.activo ? '#059669' : '#dc2626'}">
                            ${u.activo ? '● Activo' : '○ Inactivo'}
                        </span>
                    </td>
                    <td style="display:flex;gap:0.5rem">
                        ${u.rol !== 'admin' ? `
                        <button class="btn-xs ${u.activo ? 'btn-xs-danger' : 'btn-xs-success'}" onclick="toggleActivo(${u.id}, ${u.activo ? 0 : 1}, this)">
                            ${u.activo ? 'Suspender' : 'Activar'}
                        </button>
                        <button class="btn-xs btn-xs-danger" onclick="eliminarUsuario(${u.id}, '${u.nombre}', this)">🗑</button>
                        ` : '<span style="color:var(--neutral-400);font-size:0.8rem">Admin</span>'}
                    </td>
                </tr>`).join('');
        }

        function filterUsers(q) {
            const filtered = allUsuarios.filter(u =>
                (u.nombre || '').toLowerCase().includes(q.toLowerCase()) ||
                (u.email || '').toLowerCase().includes(q.toLowerCase())
            );
            renderUsuarios(filtered);
        }

        async function toggleActivo(id, newActivo, btn) {
            btn.disabled = true; btn.textContent = '...';
            try {
                const res = await ProVendAuth.apiFetch(`${API_BASE}/api/admin/usuarios/${id}/activo`, {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ activo: newActivo })
                });
                if (!res.ok) { const d = await res.json(); toast(d.error || 'Error', 'error'); return; }
                toast(newActivo ? 'Usuario activado ✅' : 'Usuario suspendido', 'success');
                await loadUsuarios();
            } catch { toast('Error de conexión', 'error'); btn.disabled = false; }
        }

        async function eliminarUsuario(id, nombre, btn) {
            if (!confirm(`¿Eliminar permanentemente al usuario "${nombre}"? Esta acción no se puede deshacer.`)) return;
            btn.disabled = true; btn.textContent = '...';
            try {
                const res = await ProVendAuth.apiFetch(`${API_BASE}/api/admin/usuarios/${id}`, { method: 'DELETE' });
                if (!res.ok) { const d = await res.json(); toast(d.error || 'Error', 'error'); return; }
                toast(`Usuario "${nombre}" eliminado`, 'success');
                await loadUsuarios();
            } catch { toast('Error de conexión', 'error'); btn.disabled = false; }
        }

        // ===== LOAD PROVEEDORES =====
        async function loadProveedores() {
            document.getElementById('proveedores-table-body').innerHTML = '<tr><td colspan="7" class="empty-admin"><span class="spinner-sm"></span> Cargando...</td></tr>';
            try {
                const res = await ProVendAuth.apiFetch(`${API_BASE}/api/admin/proveedores`);
                if (!res.ok) return;
                const proveedores = await res.json();
                if (proveedores.length === 0) {
                    document.getElementById('proveedores-table-body').innerHTML = '<tr><td colspan="7" class="empty-admin">No hay proveedores registrados aún</td></tr>';
                    return;
                }
                document.getElementById('proveedores-table-body').innerHTML = proveedores.map(p => `
                    <tr>
                        <td>
                            <div style="font-weight:600">${p.company || p.nombre}</div>
                            <div style="color:var(--neutral-500);font-size:0.8rem">${p.email}</div>
                        </td>
                        <td style="color:var(--neutral-600)">${p.categoria || '—'}</td>
                        <td style="color:var(--neutral-600)">${p.ciudad || '—'}</td>
                        <td style="text-align:center">${p.total_materiales || 0}</td>
                        <td>${p.rating_promedio ? '⭐ ' + parseFloat(p.rating_promedio).toFixed(1) : '—'}</td>
                        <td>
                            ${p.verificado
                                ? '<span class="verified-yes">✅ Verificado</span>'
                                : '<span class="verified-no">⏳ Pendiente</span>'}
                        </td>
                        <td style="display:flex;gap:0.5rem">
                            ${p.verificado
                                ? `<button class="btn-xs btn-xs-danger" onclick="toggleVerificacion(${p.id}, false, this)">Revocar</button>`
                                : `<button class="btn-xs btn-xs-success" onclick="toggleVerificacion(${p.id}, true, this)">✅ Aprobar</button>`}
                            <a href="perfil-proveedor.html?id=${p.id}" target="_blank" class="btn-xs btn-xs-primary">Ver perfil</a>
                        </td>
                    </tr>`).join('');
            } catch(e) {
                document.getElementById('proveedores-table-body').innerHTML = '<tr><td colspan="7" class="empty-admin">Error al cargar proveedores</td></tr>';
            }
        }

        async function toggleVerificacion(id, verificado, btn) {
            btn.disabled = true; btn.textContent = '...';
            try {
                const res = await ProVendAuth.apiFetch(`${API_BASE}/api/admin/proveedores/${id}/verificar`, {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ verificado })
                });
                if (!res.ok) { toast('Error al actualizar', 'error'); btn.disabled = false; return; }
                toast(verificado ? '✅ Proveedor verificado' : 'Verificación revocada', 'success');
                await loadProveedores();
                await loadStats(); // Update badge counter
            } catch { toast('Error de conexión', 'error'); btn.disabled = false; }
        }

        // ===== CHARTS LOGIC =====
        let chartUsuariosInstance = null;
        let chartActividadInstance = null;

        async function renderCharts() {
            try {
                const [statsRes, actRes] = await Promise.all([
                    ProVendAuth.apiFetch(`${API_BASE}/api/admin/stats`),
                    ProVendAuth.apiFetch(`${API_BASE}/api/admin/actividad`)
                ]);
                
                if (!statsRes.ok || !actRes.ok) return;
                
                const stats = await statsRes.json();
                const actividad = await actRes.json();

                const ctxUsuarios = document.getElementById('chartUsuarios');
                if(ctxUsuarios) {
                    if(chartUsuariosInstance) chartUsuariosInstance.destroy();
                    chartUsuariosInstance = new Chart(ctxUsuarios, {
                        type: 'doughnut',
                        data: {
                            labels: ['Empresas', 'Proveedores'],
                            datasets: [{
                                data: [stats.totalEmpresas || 0, stats.totalProveedores || 0],
                                backgroundColor: ['#2B7DE9', '#059669'],
                                borderWidth: 0
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
                    });
                }
                
                const ctxActividad = document.getElementById('chartActividad');
                if(ctxActividad) {
                    let countRegistros = 0, countMateriales = 0, countResenas = 0;
                    actividad.forEach(a => {
                        if(a.tipo === 'registro') countRegistros++;
                        else if(a.tipo === 'material') countMateriales++;
                        else if(a.tipo === 'resena') countResenas++;
                    });
                    
                    if(chartActividadInstance) chartActividadInstance.destroy();
                    chartActividadInstance = new Chart(ctxActividad, {
                        type: 'bar',
                        data: {
                            labels: ['Registros', 'Materiales', 'Reseñas'],
                            datasets: [{
                                label: 'Actividad (total)',
                                data: [countRegistros, countMateriales, countResenas],
                                backgroundColor: ['#6366f1', '#10b981', '#f59e0b'],
                                borderRadius: 4
                            }]
                        },
                        options: { 
                            responsive: true, maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
                        }
                    });
                }
            } catch(e) { console.error('Error rendering charts:', e); }
        }

        // ===== INIT =====
        function loadAll() {
            loadStats();
            loadActividad();
            renderCharts();
        }

        document.addEventListener('DOMContentLoaded', loadAll);
    </script>
</body>
</html>
