<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar — ProVend</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel='icon' type='image/jpeg' href='assets/images/logo.jpg'>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/pages.css">
    <style>
        .search-hero {
            background: linear-gradient(135deg, var(--primary-900) 0%, var(--primary-700) 100%);
            padding: 5rem 2rem;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        /* Floating shapes for hero */
        .search-hero::before, .search-hero::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
        }
        .search-hero::before {
            width: 300px; height: 300px;
            top: -100px; left: -50px;
        }
        .search-hero::after {
            width: 400px; height: 400px;
            bottom: -200px; right: -100px;
        }

        /* Fix: Explicitly override h1 color so base.css doesn't make it black in light mode */
        .search-hero h1 {
            color: white;
            font-size: 3rem;
            margin-bottom: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            position: relative;
            z-index: 2;
        }

        .search-tabs {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2.5rem;
            position: relative;
            z-index: 2;
        }

        .search-tab {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.875rem 2.5rem;
            border-radius: 99px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-tab:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .search-tab.active {
            background: white;
            color: var(--primary-900);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .search-input-group {
            max-width: 650px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .search-input-group input {
            width: 100%;
            padding: 1.25rem 2rem;
            padding-left: 3.5rem;
            border-radius: 99px;
            border: 2px solid transparent;
            font-size: 1.125rem;
            background: var(--white);
            color: var(--neutral-900);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: all 0.3s;
        }

        .search-input-group input:focus {
            outline: none;
            border-color: var(--primary-400);
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .search-input-group svg {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-500);
            pointer-events: none;
        }
        
        .page-content {
            padding: 4rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 2.5rem;
        }

        .filters-sidebar {
            background: var(--white);
            border: 1px solid var(--neutral-200);
            padding: 2rem;
            border-radius: 16px;
            height: fit-content;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 100px;
        }

        .filters-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--neutral-100);
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--neutral-900);
        }

        .filter-group { 
            margin-bottom: 2rem; 
        }

        .filter-title { 
            font-weight: 600; 
            margin-bottom: 1rem; 
            color: var(--neutral-800); 
            font-size: 1.05rem;
        }

        .filter-label {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            color: var(--neutral-600);
            cursor: pointer;
            transition: color 0.2s;
        }

        .filter-label:hover {
            color: var(--primary-600);
        }

        .filter-label input[type="checkbox"] {
            width: 1.25rem;
            height: 1.25rem;
            border-radius: 4px;
            border: 2px solid var(--neutral-300);
            accent-color: var(--primary-600);
            cursor: pointer;
            background: var(--white);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--neutral-200);
        }

        .results-count {
            color: var(--neutral-600);
            font-weight: 500;
        }
        
        .results-count span {
            color: var(--neutral-900);
            font-weight: 700;
        }

        /* Improved Empty State */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 5rem 2rem;
            background: var(--white);
            border-radius: 16px;
            border: 1px dashed var(--neutral-300);
        }

        .empty-state-icon {
            width: 80px;
            height: 80px;
            background: var(--neutral-50);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            color: var(--neutral-400);
        }

        @media (max-width: 900px) {
            .page-content {
                grid-template-columns: 1fr;
            }
            .filters-sidebar {
                position: static;
            }
            .search-hero {
                padding: 3rem 1rem;
            }
            .search-hero h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    
    <header class="search-hero">
        <h1 style="font-size:2.5rem; margin-bottom:1rem;">Encuentra lo que necesitas</h1>
        <div class="search-tabs">
            <button class="search-tab active" onclick="setTab('materiales', this)">Buscar Materiales</button>
            <button class="search-tab" onclick="setTab('empresas', this)">Buscar Empresas</button>
        </div>
        <div class="search-input-group">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" placeholder="Ej. Cartón, PET, Aluminio..." onkeyup="filterResults()">
        </div>
    </header>

    <div class="page-content">
        <!-- Filtros -->
        <aside class="filters-sidebar">
            <div class="filter-group">
                <div class="filter-title">Ubicación</div>
                <label class="filter-label"><input type="checkbox" value="Managua" onchange="filterResults()"> Managua</label>
                <label class="filter-label"><input type="checkbox" value="León" onchange="filterResults()"> León</label>
                <label class="filter-label"><input type="checkbox" value="Masaya" onchange="filterResults()"> Masaya</label>
            </div>
            <div class="filter-group">
                <div class="filter-title">Calidad</div>
                <label class="filter-label"><input type="checkbox" id="verifiedOnly" onchange="filterResults()"> Solo Verificados ✅</label>
            </div>
        </aside>

        <!-- Resultados -->
        <main>
            <div style="margin-bottom: 1rem; color: var(--neutral-500); font-weight:500;">
                <span id="resultsCount">0</span> resultados encontrados
            </div>
            <div class="grid-providers" id="resultsGrid" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));">
                <!-- Se llena con JS -->
            </div>
        </main>
    </div>

    <script src="js/mockData.js"></script>
    <script src="js/components.js"></script>
    <script>
        document.getElementById('navbar-container').innerHTML = buildNavbar('explorar');

        let currentTab = 'materiales';
        let allProviders = [];
        const COLORS = ['#2B7DE9','#27ae60','#e67e22','#9b59b6','#e74c3c','#1abc9c'];

        // Cargar proveedores reales desde la API
        async function loadProviders() {
            try {
                const res = await fetch('/api/proveedores', { credentials: 'include' });
                allProviders = await res.json();
            } catch(e) {
                allProviders = [];
            }
            filterResults();
        }

        function setTab(tab, button) {
            currentTab = tab;
            document.querySelectorAll('.search-tab').forEach(t => t.classList.remove('active'));
            if (button) button.classList.add('active');
            const input = document.getElementById('searchInput');
            input.placeholder = tab === 'materiales' ? 'Ej. Cartón, PET, Aluminio...' : 'Ej. Recicladora, EcoPlast...';
            filterResults();
        }

        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
        }

        function filterResults() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const isVerified = document.getElementById('verifiedOnly').checked;
            const locationCheckboxes = document.querySelectorAll('input[type="checkbox"][value]:checked');
            const selectedLocations = Array.from(locationCheckboxes).map(cb => cb.value);

            let filtered = allProviders.filter(p => {
                let matchesQuery = false;
                if (currentTab === 'materiales') {
                    // Buscar en el nombre del proveedor y su categoría
                    matchesQuery = p.nombre?.toLowerCase().includes(query)
                        || p.company?.toLowerCase().includes(query)
                        || p.categoria?.toLowerCase().includes(query);
                } else {
                    matchesQuery = p.nombre?.toLowerCase().includes(query)
                        || p.company?.toLowerCase().includes(query);
                }
                if (!query) matchesQuery = true;
                const matchesVerified = isVerified ? p.verificado : true;
                const matchesLocation = selectedLocations.length > 0 ? selectedLocations.includes(p.ciudad) : true;
                return matchesQuery && matchesVerified && matchesLocation;
            });

            renderResults(filtered, query);
        }

        function renderResults(providers, query = '') {
            document.getElementById('resultsCount').textContent = providers.length;
            const container = document.getElementById('resultsGrid');
            container.innerHTML = '';

            if (providers.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        </div>
                        <h3 style="color:var(--neutral-800); font-size:1.5rem; margin-bottom:0.75rem; font-weight:700;">
                            ${query ? 'No encontramos resultados para "' + query + '"' : 'No hay resultados'}
                        </h3>
                        <p style="max-width:450px; margin:0 auto 2rem; color:var(--neutral-500); font-size:1.1rem; line-height:1.6;">
                            ${query
                                ? 'Intenta usar términos más generales o verifica tu ortografía. También puedes borrar los filtros.'
                                : 'La comunidad está comenzando. Sé el primero en registrar tu empresa en ProVend.'}
                        </p>
                        ${query
                            ? '<button onclick="document.getElementById(\'searchInput\').value=\'\'; filterResults()" class="btn btn-outline btn-lg">Limpiar Búsqueda</button>'
                            : '<a href="registro.html?rol=proveedor" class="btn btn-primary btn-lg">Registrar mi empresa</a>'}
                    </div>`;
                return;
            }

            providers.forEach(p => {
                const name = String(p.company || p.nombre || 'Proveedor');
                const initials = escapeHTML(name.substring(0,2).toUpperCase());
                const color = COLORS[Number(p.id) % COLORS.length];
                const safeName = escapeHTML(name);
                const safeCategory = escapeHTML(p.categoria || 'Proveedor');
                const safeCity = escapeHTML(p.ciudad || '');
                const rating = Number(p.rating) || 0;
                const reviews = Number(p.reviews) || 0;
                container.innerHTML += `
                    <div class="provider-card" style="background:white;border:1px solid var(--neutral-200);box-shadow:none">
                        <div class="provider-card-header">
                            <div class="provider-card-logo" style="background:${color};color:white;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.25rem;border-radius:12px;width:48px;height:48px;flex-shrink:0">${initials}</div>
                            <div class="provider-card-info">
                                <div class="provider-card-name">${safeName} ${p.verificado ? 'Verificado' : ''}</div>
                                <div class="provider-card-category">${safeCategory} ${safeCity ? '· ' + safeCity : ''}</div>
                            </div>
                        </div>
                        <div class="provider-card-footer" style="margin-top:0.75rem">
                            <div class="rating-display">
                                ${reviews > 0
                                    ? `<span style="color:var(--warning-500)">★★★★★</span> <span class="rating-number">${rating.toFixed(1)}</span> <span class="rating-count">(${reviews})</span>`
                                    : '<span style="color:var(--neutral-400);font-size:0.8rem">Sin reseñas todavía</span>'}
                            </div>
                        </div>
                        <div class="provider-actions" style="margin-top:1rem">
                            <a href="perfil-proveedor.html?id=${p.id}" class="btn btn-outline" style="flex:1;text-align:center">Ver Perfil</a>
                            <a href="perfil-proveedor.html?id=${p.id}" class="btn btn-primary">Contactar</a>
                        </div>
                    </div>`;
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const tabParam = urlParams.get('tab');
            const qParam = urlParams.get('q');

            if (qParam) document.getElementById('searchInput').value = qParam;

            if (tabParam && (tabParam === 'materiales' || tabParam === 'empresas')) {
                document.querySelectorAll('.search-tab').forEach(t => {
                    if (t.textContent.toLowerCase().includes(tabParam)) t.click();
                });
            }

            loadProviders();
        });
        document.getElementById('searchInput').addEventListener('input', filterResults);
        document.getElementById('verifiedOnly').addEventListener('change', filterResults);
        document.querySelectorAll('input[type=checkbox][value]').forEach(cb => cb.addEventListener('change', filterResults));
    </script>
</body>
</html>
