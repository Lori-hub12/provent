<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar — ProVend</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel='icon' type='image/jpeg' href='assets/images/logo.jpg'>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/pages.css">
    <style>
        .search-hero {
            background: linear-gradient(135deg, var(--primary-900), var(--primary-800));
            padding: 4rem 2rem;
            text-align: center;
            color: white;
        }
        .search-tabs {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .search-tab {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 0.75rem 2rem;
            border-radius: 99px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .search-tab.active {
            background: white;
            color: var(--primary-900);
        }
        .search-input-group {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }
        .search-input-group input {
            width: 100%;
            padding: 1.25rem 2rem;
            padding-left: 3rem;
            border-radius: 99px;
            border: none;
            font-size: 1.125rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .search-input-group svg {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neutral-400);
        }
        
        .page-content {
            padding: 4rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 2rem;
        }

        .filters-sidebar {
            background: white;
            border: 1px solid var(--neutral-200);
            padding: 1.5rem;
            border-radius: 12px;
            height: fit-content;
        }
        .filter-group { margin-bottom: 1.5rem; }
        .filter-title { font-weight: 600; margin-bottom: 0.75rem; color: var(--neutral-800); }
        .filter-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            color: var(--neutral-600);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    
    <header class="search-hero">
        <h1 style="font-size:2.5rem; margin-bottom:1rem;">Encuentra lo que necesitas</h1>
        <div class="search-tabs">
            <button class="search-tab active" onclick="setTab('materiales')">Buscar Materiales</button>
            <button class="search-tab" onclick="setTab('empresas')">Buscar Empresas</button>
        </div>
        <div class="search-input-group">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" placeholder="Ej. Cartón, PET, Aluminio..." onkeyup="filterResults()">
        </div>
    </header>

    <div class="page-content">
        <!-- Filtros -->
        <aside class="filters-sidebar">
            <div class="filter-group">
                <div class="filter-title">Ubicación</div>
                <label class="filter-label"><input type="checkbox" value="Managua" onchange="filterResults()"> Managua</label>
                <label class="filter-label"><input type="checkbox" value="León" onchange="filterResults()"> León</label>
                <label class="filter-label"><input type="checkbox" value="Masaya" onchange="filterResults()"> Masaya</label>
            </div>
            <div class="filter-group">
                <div class="filter-title">Calidad</div>
                <label class="filter-label"><input type="checkbox" id="verifiedOnly" onchange="filterResults()"> Solo Verificados ✅</label>
            </div>
        </aside>

        <!-- Resultados -->
        <main>
            <div style="margin-bottom: 1rem; color: var(--neutral-500); font-weight:500;">
                <span id="resultsCount">0</span> resultados encontrados
            </div>
            <div class="grid-providers" id="resultsGrid" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));">
                <!-- Se llena con JS -->
            </div>
        </main>
    </div>

    <script src="js/mockData.js"></script>
    <script src="js/components.js"></script>
    <script>
        document.getElementById('navbar-container').innerHTML = createNavbar();

        let currentTab = 'materiales';

        function setTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.search-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            const input = document.getElementById('searchInput');
            if (tab === 'materiales') {
                input.placeholder = "Ej. Cartón, PET, Aluminio...";
            } else {
                input.placeholder = "Ej. Recicladora Managua, EcoPlast...";
            }
            filterResults();
        }

        function filterResults() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const isVerified = document.getElementById('verifiedOnly').checked;
            
            // Get checked locations
            const locationCheckboxes = document.querySelectorAll('input[type="checkbox"][value]:checked');
            const selectedLocations = Array.from(locationCheckboxes).map(cb => cb.value);

            const allProviders = window.ProVendData.getProveedores();
            
            const filtered = allProviders.filter(p => {
                let matchesQuery = false;
                if (currentTab === 'materiales') {
                    matchesQuery = p.materiales.some(m => m.toLowerCase().includes(query)) || p.categoria.toLowerCase().includes(query);
                } else {
                    matchesQuery = p.nombre.toLowerCase().includes(query);
                }
                if (query === '') matchesQuery = true; // Show all if empty

                const matchesVerified = isVerified ? p.verificado : true;
                const matchesLocation = selectedLocations.length > 0 ? selectedLocations.includes(p.ciudad) : true;

                return matchesQuery && matchesVerified && matchesLocation;
            });

            renderResults(filtered);
        }

        function renderResults(providers) {
            document.getElementById('resultsCount').textContent = providers.length;
            const container = document.getElementById('resultsGrid');
            container.innerHTML = '';
            
            providers.forEach(p => {
                container.innerHTML += `
                    <div class="provider-card" style="background:white; border:1px solid var(--neutral-200); box-shadow:none;">
                        <img src="${p.logo}" class="provider-logo" alt="${p.nombre}">
                        <div class="provider-info">
                            <h3 class="provider-name">${p.nombre} ${p.verificado ? '✅' : ''}</h3>
                            <p class="provider-category">${p.categoria} • ${p.ciudad}</p>
                            <div class="provider-rating">
                                <span class="stars">★★★★★</span>
                                <span class="rating-number">${p.rating}</span>
                                <span class="reviews-count">(${p.reviews})</span>
                            </div>
                            <div class="provider-tags">
                                ${p.materiales.map(m => `<span class="tag">${m}</span>`).join('')}
                            </div>
                            <div class="provider-actions" style="margin-top:1rem;">
                                <a href="perfil-proveedor.html?id=${p.id}" class="btn btn-outline" style="flex:1; text-align:center;">Ver Perfil</a>
                                <button class="btn btn-primary" onclick="alert('Funcionalidad de contacto requerirá iniciar sesión.')">Contactar</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Check if URL has tab param
            const urlParams = new URLSearchParams(window.location.search);
            const tabParam = urlParams.get('tab');
            if (tabParam && (tabParam === 'materiales' || tabParam === 'empresas')) {
                // simulated click on tab
                document.querySelectorAll('.search-tab').forEach(t => {
                    if(t.textContent.toLowerCase().includes(tabParam)) {
                        t.click();
                    }
                });
            } else {
                filterResults();
            }
        });
    </script>
</body>
</html>
